<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
<title id="title">Xymatics</title>
<desc id="desc">Nodal X favicon, simplified to stay legible at 16 px.</desc>
<!--
Nodal X. Square plate, centred coordinates u, v in [-1, 1]:
  f(u, v) = cos(πu)cos(2πv) − cos(2πu)cos(πv) = (cos πv − cos πu)(2 cos πu cos πv + 1)
Nodal lines (f = 0) traced by marching squares on a 1000 × 1000 lattice and checked against that factorization:
2 traces on u = ±v (max deviation 5.7e-4), 4 arcs on 2 cos πu cos πv = −1 (max deviation 9.0e-7).
The four arcs close against the plate's rim (ends at ±1/3, apex 2/3 from centre).
Exported: the diagonals exactly; the top arc resampled every 2.5 units as a Catmull-Rom curve, and its three
quarter turns. Mapping x = 128 + 86u, y = 128 − 86v. Weights: diagonals 13, arcs 8.
Brush gaps: offset curves p(s) + d(s)n(s) of the same lines entering at each stroke end, d linear in s,
repeated by quarter turns. Generated by scripts/brand/nodal-x.mjs.
Small rendition: no brush gaps, plate half-width 96, diagonals 28, arcs 20.
A media query inside the file hides the arcs and thickens the diagonals to 34 at 24 px or less (the 16 px size).
Tile: 256 square, corner radius 48.
-->
<style>@media (max-width: 24px) { .fine { display: none } .bold { stroke-width: 34px } }</style><rect width="256" height="256" rx="48" fill="#1a1a1d"/>
